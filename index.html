    <script>
        // Tema y acento antes de pintar (evita el parpadeo).
        (function () {
            try {
                var ap = JSON.parse(localStorage.getItem('financiapp_apariencia')) || {};
                var claro = ap.tema === 'claro' || (ap.tema === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', claro ? 'light' : 'dark');
                if (ap.acento && ap.acento !== 'lima') document.documentElement.setAttribute('data-accent', ap.acento);
            } catch (e) {}
        })();
    </script>
